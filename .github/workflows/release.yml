name: macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (empty reads VERSION)
        type: string
        required: false
      dry_run:
        description: Preview only; no build, signing, Apple or GitHub writes
        type: boolean
        default: true
      publish:
        description: Publish verified assets and update the Homebrew cask
        type: boolean
        default: false

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preview
        if: inputs.dry_run
        env:
          VERSION_INPUT: ${{ inputs.version }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          args=(release --dry-run --build "${GITHUB_RUN_NUMBER}")
          if [[ -n "$VERSION_INPUT" ]]; then args+=(--version "$VERSION_INPUT"); fi
          if [[ "$PUBLISH_INPUT" == true ]]; then args+=(--publish); fi
          ./scripts/app.py "${args[@]}"
      - name: Build, sign and notarize; optionally publish and update the cask
        if: '!inputs.dry_run'
        env:
          VERSION_INPUT: ${{ inputs.version }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_NOTARIZATION_PRIVATE_KEY: ${{ secrets.APPLE_NOTARIZATION_PRIVATE_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          args=(release --execute --build "${GITHUB_RUN_NUMBER}")
          if [[ -n "$VERSION_INPUT" ]]; then args+=(--version "$VERSION_INPUT"); fi
          if [[ "$PUBLISH_INPUT" == true ]]; then args+=(--publish); fi
          ./scripts/app.py "${args[@]}"
      - uses: actions/upload-artifact@v6
        if: always() && !inputs.dry_run
        with:
          name: release
          path: dist/release
          if-no-files-found: warn
